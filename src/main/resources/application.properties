spring.application.name=spring-boot-lab6
server.port=8080

# База данных H2 в файле testdb/students.mv.db в папке проекта.
# AUTO_SERVER=TRUE позволяет одновременно подключиться к базе из DBeaver, пока работает приложение
spring.datasource.url=jdbc:h2:file:./testdb/students;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Таблицы создаются скриптом schema.sql при каждом запуске (CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Выводить в консоль SQL-запросы, которые выполняет Hibernate
spring.jpa.show-sql=true
